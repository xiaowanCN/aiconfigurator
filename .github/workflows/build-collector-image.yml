name: Build and Push Collector Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag (e.g., v1, latest)'
        required: true
        default: 'latest'
      dockerfile:
        description: 'Dockerfile to build'
        required: true
        default: 'docker/Dockerfile.vllm-collector-deploy.ci.nopd'
        type: choice
        options:
          - docker/Dockerfile.vllm-collector-deploy.ci.nopd
          - docker/Dockerfile.vllm-collector-deploy.ci
          - docker/Dockerfile.vllm-collector-deploy
          - docker/Dockerfile.collector

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  REGISTRY: quay.io
  IMAGE_NAME: ai-dynamo/aiconfigurator-collector

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          lfs: true
          fetch-depth: 0

      - name: Git LFS Pull
        run: git lfs pull

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=sha,prefix=

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Pushed image ${{ steps.meta.outputs.tags }}"
